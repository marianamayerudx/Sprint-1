<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Pink Pixel Dreams</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="flower" style="left:10%">🌸</div>
<div class="flower" style="left:30%">🌸</div>
<div class="flower" style="left:50%">🌸</div>
<div class="flower" style="left:70%">🌸</div>
<div class="flower" style="left:90%">🌸</div>


    <header>
        <h1>🌸 Pink Pixel Dreams 🌸</h1>

        <p class="subtitle">
            Explore pequenos sonhos em um mundo mágico de pixels
        </p>
    </header>


    <div class="container">

        <div class="box">

            <div class="image-space">
                Espaço para imagem do jogo
            </div>

            <button class="play">PLAY</button>

        </div>


        <div class="box controls-box">

            <div class="controls-text">

                <h2>Controles</h2>

                <p>Teclas W A S D ou Setas → mover</p>
                <p>Tecla E → interagir</p>

            </div>

            <div class="controls-image">
                Espaço para imagem
            </div>

        </div>


        <div class="box">

            <h2>Como Jogar</h2>

            <p>
                Explore o mundo, descubra segredos e colete fragmentos de sonhos.
            </p>

        </div>

    </div>

</body>

</html>
